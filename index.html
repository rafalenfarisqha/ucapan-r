<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Raffi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Mini Game untuk Raffi</h1>
        <p>Kumpulkan 10 poin untuk melihat catatan kecil ini.</p>
        <div class="score-board">Skor: <span id="score">0</span></div>
        
        <div id="play-area">
            <div id="target-heart">❤️</div>
        </div>

        <div id="secret-message" class="hidden">
            <h2>Terima Kasih, Raffi</h2>
            <p>Terima kasih sudah banyak membantu dan selalu ada. Semoga urusanmu selalu dimudahkan dan sukses terus kedepannya.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
